name: Build APK
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Arrange project
        run: |
          mkdir -p src/main/java/com/example/launcher
          cp *.kt src/main/java/com/example/launcher/
          cp AndroidManifest.xml src/main/AndroidManifest.xml
      - name: Build
        run: gradle assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: build/outputs/apk/debug/app-debug.apk
